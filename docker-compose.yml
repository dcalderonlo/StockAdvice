version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockadvice
      POSTGRES_PASSWORD: stockadvice
      POSTGRES_DB: stockadvice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockadvice -d stockadvice"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stockadvice

  redis:
    image: redis:7-alpine
    networks:
      - stockadvice

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://stockadvice:stockadvice@db:5432/stockadvice
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - stockadvice

  worker:
    build: .
    command: python manage.py qcluster
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://stockadvice:stockadvice@db:5432/stockadvice
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - stockadvice

volumes:
  postgres_data:

networks:
  stockadvice:
