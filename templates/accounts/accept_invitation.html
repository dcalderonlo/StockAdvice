{% extends "base.html" %}

{% block title %}Accept invitation - StockAdvice{% endblock %}

{% block content %}
<h1>Accept invitation</h1>
<p>You have been invited as <strong>{{ invitation.email }}</strong>. Create your password to continue.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Create account</button>
</form>
{% endblock %}
