{% extends "base.html" %}

{% block title %}Iniciar sesión - StockAdvice{% endblock %}

{% block content %}
<h1>Iniciar sesión</h1>
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Ingresar</button>
</form>
<p><a href="{% url 'accounts:password_reset_request' %}">¿Olvidaste tu contraseña?</a></p>
{% endblock %}
