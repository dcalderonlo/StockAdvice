{% extends "base.html" %}

{% block title %}Log in - StockAdvice{% endblock %}

{% block content %}
<h1>Log in</h1>
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Ingresar</button>
</form>
<p><a href="{% url 'accounts:password_reset_request' %}">Forgot your password?</a></p>
{% endblock %}
