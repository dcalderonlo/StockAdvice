<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block subject %}StockAdvice{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.5; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 24px; }
    .button { display: inline-block; padding: 12px 24px; background: #005fcc; color: #fff; text-decoration: none; border-radius: 4px; }
    .footer { margin-top: 32px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
    <div class="footer">
      StockAdvice — Sistema de asesoría de reposición de inventario
    </div>
  </div>
</body>
</html>
