[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockadvice"
version = "0.1.0"
description = "Scheduled stock replenishment advisory service"
requires-python = ">=3.12"
authors = [
    { name = "StockAdvice Team" },
]
dependencies = [
    "Django>=5.1,<5.2",
    "django-environ>=0.11,<0.12",
    "psycopg[binary]>=3.2,<3.3",
    "django-allauth>=0.63,<0.64",
    "django-q2>=1.7,<1.8",
    "redis>=5.0,<6.0",
    "structlog>=24.1,<25.0",
    "gunicorn>=23.0,<24.0",
    "whitenoise>=6.7,<6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-django>=4.8,<4.9",
    "pytest-cov>=5.0,<5.1",
    "pytest-mock>=3.14,<3.15",
    "factory_boy>=3.3,<3.4",
    "django-debug-toolbar>=4.4,<4.5",
    "ruff>=0.6,<0.7",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
addopts = "-ra --strict-markers"
