name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build (no push)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          tags: stockadvice:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
